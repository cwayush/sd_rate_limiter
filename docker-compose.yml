services: 
  redis:
    image: redis:8-alpine
    container_name: rate-limiter-redis
    ports: 
      - "6379:6379"

  api-1:
    build: .
    container_name: rate-limiter-api-1
    env_file:
      - .env.docker
    environment:
      PORT: 3000
      SERVER_NAME: API-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    ports:
      - "3001:3000"

  api-2: 
    build: .
    container_name: rate-limiter-api-2
    env_file:
      - .env.docker
    environment:
      PORT: 3000
      SERVER_NAME: API-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    ports:
      - "3002:3000"

  api-3:
    build: .
    container_name: rate-limiter-api-3
    env_file:
      - .env.docker
    environment:
      PORT: 3000
      SERVER_NAME: API-3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    ports:
      - "3003:3000"

  nginx:
    image: nginx:alpine
    container_name: rate_limiter-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3